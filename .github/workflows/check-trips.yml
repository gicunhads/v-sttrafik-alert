name: Check Västtrafik trips

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

jobs:
  check-trips:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Diagnose database connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          from urllib.parse import urlparse
          print("GitHub host:", urlparse(url).hostname)

          if url.startswith("postgres://"):
              url = url.replace(
                  "postgres://",
                  "postgresql://",
                  1
              )

          engine = create_engine(url)

          with engine.connect() as connection:
              database_name = connection.execute(
                  text("SELECT current_database()")
              ).scalar_one()

              database_user = connection.execute(
                  text("SELECT current_user")
              ).scalar_one()

              trip_count = connection.execute(
                  text("SELECT COUNT(*) FROM saved_trips")
              ).scalar_one()

          print("GitHub database:", database_name)
          print("GitHub database user:", database_user)
          print("Trips visible directly:", trip_count)
          PY

      - name: Check saved trips
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRAFIKLAB_API_KEY: ${{ secrets.TRAFIKLAB_API_KEY }}
          VAPID_PRIVATE_KEY_BASE64: ${{ secrets.VAPID_PRIVATE_KEY_BASE64 }}
        run: python src/check_trips.py
