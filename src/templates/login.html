<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Trip Alert</title>
</head>

<body>

    <h1>Log in</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>
            Email

            <input
                type="email"
                name="email"
                required
            >
        </label>

        <br>
        <br>

        <label>
            Password

            <input
                type="password"
                name="password"
                required
            >
        </label>

        <br>
        <br>

        <button type="submit">
            Log in
        </button>

    </form>

    <br>

    <a href="/register">
        Create an account
    </a>

</body>

</html>
