<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#ffffff"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Trip Alert"
    >

    <link
        rel="manifest"
        href="/manifest.json"
    >

    <title>Trip Alert</title>
</head>
<script>
    if ("serviceWorker" in navigator) {
        navigator.serviceWorker
            .register("/service-worker.js")
            .catch(error => {
                console.error(
                    "Service worker registration failed:",
                    error
                );
            });
    }
</script>
<body>

    <h1>Trip Alert</h1>

    <p>
        Get notified when something happens
        to your usual trip.
    </p>

    <nav>
        <a href="/trips">
            My Trips
        </a>

        |

        <a href="/notifications">
            Notifications
        </a>

        |

        <a href="/logout">
            Log out
        </a>
    </nav>

    <h2>
        Where do you travel from?
    </h2>

    <form method="POST">

        <input
            type="text"
            name="stop_name"
            placeholder="Search for a stop..."
            value="{{ search }}"
            required
        >

        <button type="submit">
            Search
        </button>

    </form>


    {% if stops %}

        <h2>Select a stop</h2>

        {% for stop in stops %}

            <form
                method="GET"
                action="/stop/{{ stop.id }}"
            >

                <button type="submit">

                    <strong>
                        {{ stop.name }}
                    </strong>

                    <br>

                    {{
                        stop.transport_modes
                        | join(", ")
                    }}

                </button>

            </form>

            <br>

        {% endfor %}

    {% endif %}

</body>

</html>
