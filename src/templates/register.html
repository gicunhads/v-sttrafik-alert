<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - Trip Alert</title>
</head>

<body>

    <h1>Create account</h1>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

    <form method="POST">

        <label>
            Email

            <input
                type="email"
                name="email"
                required
            >
        </label>

        <br>
        <br>

        <label>
            Password

            <input
                type="password"
                name="password"
                required
            >
        </label>

        <br>
        <br>

        <label>
            Confirm password

            <input
                type="password"
                name="confirm_password"
                required
            >
        </label>

        <br>
        <br>

        <button type="submit">
            Create account
        </button>

    </form>

    <br>

    <a href="/login">
        Already have an account? Log in
    </a>

</body>

</html>
